<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GestionIncidencias</title>
    <base href="/" />

    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500,700&display=swap" rel="stylesheet" />
    <link href="_content/MudBlazor/MudBlazor.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" href="https://favicon.im/www.coopantex.coop" />
</head>

<body>
    <div id="app">
        <div style="height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background-color: #f8f9fa;">
            <div class="spinner-border text-danger" style="width: 4rem; height: 4rem; border-width: 0.3em;" role="status">
                <span class="visually-hidden">Cargando...</span>
            </div>
            <h4 style="margin-top: 20px; color: #495057; font-weight: 700; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;">
                Gestión de Incidencias
            </h4>
            <p style="color: #6c757d; font-size: 0.9rem;">Iniciando sistema seguro...</p>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>

    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        window.clipboardService = {
            processPaste: function (elementId, dotnetHelper) {
                const element = document.getElementById(elementId);
                if (!element) return;
                const handlePaste = (e) => {
                    const currentElement = document.getElementById(elementId);
                    if (!currentElement) return;

                    const items = (e.clipboardData || e.originalEvent.clipboardData).items;
                    for (let i = 0; i < items.length; i++) {
                        if (items[i].type.indexOf('image') !== -1) {
                            const blob = items[i].getAsFile();
                            const reader = new FileReader();
                            reader.onload = (event) => {
                                if (dotnetHelper) {
                                    const base64Data = event.target.result.split(',')[1];
                                    dotnetHelper.invokeMethodAsync('ProcesarImagen', base64Data);
                                }
                            };
                            reader.readAsDataURL(blob);
                        }
                    }
                };
                element.removeEventListener('paste', handlePaste);
                element.addEventListener('paste', handlePaste);
            }
        };
    </script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
